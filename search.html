<!doctype html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">



<title>搜索 · 我的豆瓣存档</title>

<style>
:root {
  --bg: #fdfdfc; --fg: #1a1a18; --dim: #6b6b64; --line: #e4e4de; --accent: #7a6a3f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16161a; --fg: #e8e8e4; --dim: #96968c; --line: #2c2c32; --accent: #c4b07a; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.7 system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
.wrap { max-width: 62rem; margin: 0 auto; padding: 1.5rem 1.2rem 5rem; }
a { color: inherit; }
a:hover { color: var(--accent); }
header.site { border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
header.site .wrap { padding-bottom: .9rem; padding-top: 1.1rem; }
header.site nav { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin-top: .5rem; }
header.site nav a { text-decoration: none; color: var(--dim); font-size: .92rem; }
header.site nav a:hover { color: var(--accent); }
header.site .home { font-weight: 600; text-decoration: none; }
h1 { font-size: 1.5rem; line-height: 1.35; margin: 0 0 .4rem; }
h2 { font-size: 1.15rem; margin: 2.2rem 0 .8rem; }
h3 { font-size: 1rem; margin: 1.8rem 0 .5rem; font-weight: 600; }
.dim { color: var(--dim); font-size: .9rem; }
.grid {
  display: grid; gap: 1.4rem 1rem; padding: 0; list-style: none;
  grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
}
.grid a { text-decoration: none; display: block; }
.grid img {
  width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block;
  background: var(--line); border-radius: 3px;
}
 
.grid .nocover {
  width: 100%; aspect-ratio: 2/3; background: var(--line); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: .8rem; text-align: center; padding: .5rem;
}
.grid .t { font-size: .86rem; line-height: 1.4; margin-top: .45rem; }
.grid .m { font-size: .78rem; color: var(--dim); }
.pager { margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: .3rem .8rem; align-items: baseline; font-size: .9rem; }
.pager a, .pager strong { padding: .1rem .35rem; }
.pager strong { background: var(--line); border-radius: 3px; }
article img { max-width: 100%; height: auto; border-radius: 3px; }
blockquote {
  margin: 1rem 0; padding: .1rem 0 .1rem 1rem;
  border-left: 2px solid var(--line); color: var(--dim);
}
.entry { border-top: 1px solid var(--line); padding-top: 1.2rem; margin-top: 1.8rem; }
.entry:first-of-type { border-top: 0; }
table { border-collapse: collapse; }
td, th { padding: .2rem .8rem .2rem 0; text-align: left; }
footer.site { border-top: 1px solid var(--line); margin-top: 4rem; }
footer.site .wrap { padding: 1.2rem; font-size: .85rem; color: var(--dim); }
</style>
</head>
<body>

<header class="site"><div class="wrap">
  <a class="home" href="./index.html">我的豆瓣存档</a>
  <nav>
    
      <a href="./book/index.html">书</a>
    
      <a href="./broadcast/index.html">广播</a>
    
      <a href="./drama/index.html">舞台剧</a>
    
      <a href="./game/index.html">游戏</a>
    
      <a href="./movie/index.html">影视</a>
    
      <a href="./music/index.html">音乐</a>
    
      <a href="./note/index.html">日记</a>
    
      <a href="./review/index.html">评论</a>
    
    <a href="./search.html">搜索</a>
  </nav>
</div></header>

<div class="wrap">

<h1>搜索</h1>


<div class="searchbox">
  <input id="q" type="search" placeholder="搜自己写过的字…" autocomplete="off"
         autofocus disabled aria-describedby="idxstate">
  <p id="idxstate" class="dim idx idx-loading">
    <span class="bar"><span></span></span>
    正在载入索引…
  </p>
</div>

<p id="stat" class="dim"></p>
<div id="out"></div>

<style>
.searchbox { margin: 1.4rem 0 .6rem; }
#q {
  width: 100%; padding: .6rem .8rem; font: inherit;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 4px;
}
#q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#q:disabled { opacity: .6; }
.idx { display: flex; align-items: center; gap: .5rem; margin: .5rem 0 0; font-size: .85rem; }
.idx .bar {
  display: none; width: 7rem; height: 3px; border-radius: 2px;
  background: var(--line); overflow: hidden;
}
.idx-loading .bar { display: inline-block; }
.idx-loading .bar span {
  display: block; width: 40%; height: 100%; background: var(--accent);
  animation: slide 1.1s ease-in-out infinite;
}
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
.idx-ready::before { content: "✓"; color: var(--accent); font-weight: 600; }
.idx-error::before { content: "⚠"; }
.hit { border-top: 1px solid var(--line); padding: .9rem 0; }
.hit a { text-decoration: none; font-weight: 600; }
.hit .meta { font-size: .82rem; color: var(--dim); margin-top: .15rem; }
.hit .snip { margin-top: .35rem; }
.hit mark { background: var(--accent); color: var(--bg); border-radius: 2px; padding: 0 .1em; }
</style>

<script>
(function () {
  var q = document.getElementById('q');
  var state = document.getElementById('idxstate');
  var stat = document.getElementById('stat');
  var out = document.getElementById('out');
  var rows = null;

  var NAMES = { movie: '影视', book: '书', music: '音乐', game: '游戏', drama: '舞台剧',
                note: '日记', review: '评论' };
  var KIND = { m: '标记', b: '广播', l: '长文' };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  
  
  function snippet(text, lq) {
    var i = text.toLowerCase().indexOf(lq);
    if (i < 0) return esc(text.slice(0, 120));
    var from = Math.max(0, i - 40);
    var s = (from > 0 ? '…' : '') + text.slice(from, i + lq.length + 90);
    var j = s.toLowerCase().indexOf(lq);
    return esc(s.slice(0, j)) + '<mark>' + esc(s.slice(j, j + lq.length)) + '</mark>'
      + esc(s.slice(j + lq.length));
  }

  function run() {
    var raw = q.value.trim();
    if (!rows || !raw) { out.innerHTML = ''; stat.textContent = ''; return; }
    var lq = raw.toLowerCase();

    var hits = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var alias = r.a ? r.a.join(' ') : '';
      
      var inTitle = (r.n && r.n.toLowerCase().indexOf(lq) >= 0)
        || (alias && alias.toLowerCase().indexOf(lq) >= 0);
      
      
      var inBody = (r.c && r.c.toLowerCase().indexOf(lq) >= 0)
        || (r.w && r.w.toLowerCase().indexOf(lq) >= 0);
      
      
      if (inTitle || inBody) hits.push({ r: r, rank: inTitle ? 0 : 1, inTitle: inTitle });
    }
    hits.sort(function (a, b) { return a.rank - b.rank; });

    
    stat.textContent = hits.length ? ('找到 ' + hits.length + ' 条') : '没有找到「' + raw + '」';

    var html = '';
    for (var k = 0; k < Math.min(hits.length, 200); k++) {
      var h = hits[k], d = h.r;
      var title = d.n || (d.t === 'b' ? '广播' : '未知作品');
      var where = KIND[d.t] + (d.k ? ' · ' + (NAMES[d.k] || d.k) : '');
      
      
      var hitInfo = d.w && d.w.toLowerCase().indexOf(lq) >= 0
        ? '<div class="snip">' + snippet(d.w, lq) + '</div>' : '';
      var hitAlias = d.a && d.a.join(' ').toLowerCase().indexOf(lq) >= 0
        ? '<div class="snip">' + snippet(d.a.join(' / '), lq) + '</div>' : '';
      html += '<div class="hit"><a href="' + esc(d.u) + '.html">' + esc(title) + '</a>'
        + '<div class="meta">' + esc(where) + (d.d ? ' · ' + esc(d.d) : '') + '</div>'
        + hitAlias
        + hitInfo
        + (d.c ? '<div class="snip">' + snippet(d.c, lq) + '</div>' : '')
        + '</div>';
    }
    if (hits.length > 200) html += '<p class="dim">（只显示前 200 条）</p>';
    out.innerHTML = html;
  }

  function ready(n) {
    state.className = 'dim idx idx-ready';
    state.textContent = ' 索引就绪 · ' + n + ' 条';
    q.disabled = false;
    q.focus();
  }

  function failed(why) {
    state.className = 'dim idx idx-error';
    
    state.textContent = ' 索引没载入成功（' + why + '），搜索用不了。';
  }

  var s = document.createElement('script');
  
  
  
  s.src = 'search-index.js';
  s.onload = function () {
    rows = window.DOUBAK_SEARCH;
    if (!rows) return failed('文件载入了但内容不对');
    ready(rows.length);
    
    var m = /[?&]q=([^&]*)/.exec(location.search);
    if (m) { q.value = decodeURIComponent(m[1].replace(/\+/g, ' ')); run(); }
  };
  s.onerror = function () { failed('找不到 search-index.js'); };
  document.head.appendChild(s);

  q.addEventListener('input', run);
})();
</script>

</div>

<footer class="site"><div class="wrap">

</body>
</html>
