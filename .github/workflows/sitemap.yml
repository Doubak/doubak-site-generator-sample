name: Sitemap

# Regenerates sitemap.xml on every push to main.
#
# MODE below decides what happens with the result:
#   pr    - open (or update) a pull request with the new sitemap, for you to merge
#   push  - commit it straight to main
# Switching is a one-word edit; nothing else in this file changes.
#
# 'pr' mode needs "Allow GitHub Actions to create and approve pull requests"
# turned on under Settings > Actions > General > Workflow permissions.
#
# Pushes made with GITHUB_TOKEN do not trigger workflows, so neither mode can
# re-trigger this job.
#
# deploy.js keeps .github/ when it re-lays the site, so this workflow survives
# a regeneration. sitemap.xml itself does not — it is deleted as a leftover and
# rewritten by the run that the deploy push kicks off.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sitemap
  cancel-in-progress: false

env:
  MODE: pr

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # generate-sitemap derives each <lastmod> from `git log -1` on the
          # file, and falls back to "now" for anything it cannot find, so it
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Generate sitemap
        id: generate
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://sample.doubak.com/
          # The site has no PDFs; skip the scan for them.
          include-pdf: false

      - name: Fix up the sitemap
        env:
          SITEMAP: ${{ steps.generate.outputs.sitemap-path }}
        run: python3 .github/scripts/fix-sitemap.py "$SITEMAP"

      - name: Open a pull request
        if: env.MODE == 'pr'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: sitemap.xml
          branch: chore/sitemap
          delete-branch: true
          commit-message: 重新生成 sitemap.xml
          title: 重新生成 sitemap.xml
          body: |
            `${{ github.workflow }}` 跟着 ${{ github.sha }} 重新生成了 sitemap.xml。

            - 收录 ${{ steps.generate.outputs.url-count }} 个 URL（还要减去 `fix-sitemap.py` 去掉的分页壳子，见该次运行的日志）
            - 因为 `noindex` 被 action 排除的：${{ steps.generate.outputs.excluded-count }} 个

            合并之后下一次 `deploy.js` 推送之前记得先 `git pull`。

      - name: Commit and push
        if: env.MODE == 'push'
        env:
          SITEMAP: ${{ steps.generate.outputs.sitemap-path }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- "$SITEMAP"
          if git diff --cached --quiet; then
            echo "Sitemap unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '重新生成 sitemap.xml'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing onto origin/$BRANCH and retrying."
            sleep $((attempt * 3))
            git pull --rebase origin "$BRANCH"
          done
          echo "Could not push the sitemap after 3 attempts." >&2
          exit 1
